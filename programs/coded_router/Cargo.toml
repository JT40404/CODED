[package]
name = "coded_router"
version = "0.1.0"
description = "CODED: programmable routing for pump.fun creator fees"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coded_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
